# Render Blueprint for the API. Secrets marked sync: false are entered in the Render dashboard.
services:
  - type: web
    name: apitestgen-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ConnectionStrings__Default
        sync: false # postgres://... URL from Neon (or Render Postgres)
      - key: Jwt__Key
        generateValue: true
      - key: Gemini__ApiKey
        sync: false
      - key: Cors__Origins__0
        sync: false # e.g. https://apitestgen.vercel.app
